name: repo-guard
# Server-side check (hooks can be skipped): audio must be recordings/sample-* and at most 10 minutes.
on: [push, pull_request]
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install av
      - run: python scripts/repo_guard.py --all
