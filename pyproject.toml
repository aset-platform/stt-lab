[project]
name = "stt-lab"
version = "0.1.0"
description = "Local meeting transcription (Whisper medium + pyannote) with speaker labels, English output and LLM hand-off"
readme = "README.md"
authors = [
    { name = "Abhay Kumar Singh", email = "asequitytrading@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "mlx-whisper>=0.4.3",
    "pyannote-audio>=4.0.7",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
    "yt-dlp>=2026.10.26",
]

[tool.uv]
package = false  # an app run with `uv run server.py`, not an installable package

[dependency-groups]
dev = [
    "playwright>=1.64.1",
]
